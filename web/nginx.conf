server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser calls /api on this same host; nginx forwards it to the API container.
    # (Same origin: no CORS needed here. The API also allows the front origins for direct calls.)
    # Docker's internal DNS + a variable: nginx starts even if the API is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular router: any other route returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
