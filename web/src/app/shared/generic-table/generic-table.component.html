<div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      @if (headerTemplate(); as header) {
        <ng-container [ngTemplateOutlet]="header" />
      }
    </thead>
    <tbody>
      @if (loading()) {
        <tr>
          <td colspan="100" class="text-center text-body-secondary py-4">
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Cargando...
          </td>
        </tr>
      } @else if (items().length === 0) {
        <tr>
          <td colspan="100" class="text-center text-body-secondary py-4">{{ emptyText() }}</td>
        </tr>
      } @else {
        @for (item of items(); track $index) {
          <tr
            class="clickable"
            tabindex="0"
            (click)="rowClick.emit(item)"
            (keydown.enter)="rowClick.emit(item)"
          >
            <ng-container [ngTemplateOutlet]="rowTemplate()" [ngTemplateOutletContext]="{ $implicit: item }" />
          </tr>
        }
      }
    </tbody>
  </table>
</div>
